name: Helm CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: azure/setup-helm@v5
        with:
          version: v3.22.1

      - name: Lint chart and verify replica counts
        shell: bash
        run: |
          set -euo pipefail
          helm lint ./charts/nginx-web
          helm template nginx-lab ./charts/nginx-web \
            | grep -Fx '  replicas: 2'
          helm template nginx-lab ./charts/nginx-web --set replicaCount=3 \
            | grep -Fx '  replicas: 3'


      - name: Create Kind cluster
        uses: helm/kind-action@v1

      - name: Install chart and test homepage
        shell: bash
        run: |
          set -euo pipefail
          helm install nginx-lab ./charts/nginx-web \
            --namespace helm-lab --create-namespace --wait --timeout 3m
          helm test nginx-lab \
            --namespace helm-lab --logs --timeout 2m
