name: Helm CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: azure/setup-helm@v5
        with:
          version: v3.22.1

      - name: Lint chart and verify replica counts
        shell: bash
        run: |
          set -euo pipefail
          helm lint ./charts/nginx-web
          helm template nginx-lab ./charts/nginx-web \
            | grep -Fx '  replicas: 2'
          helm template nginx-lab ./charts/nginx-web --set replicaCount=4 \
            | grep -Fx '  replicas: 4'
