apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Dbayode/kubernetes-fundamentals.git
    targetRevision: main
    path: charts/nginx-web
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-lab
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
